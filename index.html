<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyFlow</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#090811;color:#eee}button,input,textarea,select{font:inherit}.shell{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#11101b;border-right:1px solid #29243b;padding:20px 13px}.logo{font-size:21px;font-weight:800;padding:8px 10px 22px;color:#eee}.logo b{color:#a978ff}.nav button{display:block;width:100%;border:0;background:none;color:#a7a1b4;text-align:left;padding:11px 12px;margin:4px 0;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.on{background:#292044;color:#fff}.main{margin-left:235px;padding:25px;width:calc(100% - 235px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.muted{color:#898397}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.box{background:#14131e;border:1px solid #29243a;border-radius:14px;padding:18px}.num{font-size:26px;font-weight:800;margin-top:8px;color:#b18cff}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}.row{padding:11px 0;border-bottom:1px solid #29243a;display:flex;justify-content:space-between}.btn{background:#8257e6;border:0;color:white;padding:10px 13px;border-radius:9px;cursor:pointer}.input{width:100%;padding:11px;background:#0d0c14;border:1px solid #332e40;color:#fff;border-radius:8px;margin:6px 0 12px}.page{display:none}.page.on{display:block}.login{position:fixed;inset:0;display:grid;place-items:center;background:#090811;z-index:10}.loginbox{width:min(390px,92vw);padding:27px;background:#15131f;border:1px solid #332b48;border-radius:18px}.pill{background:#292044;color:#cdbaff;padding:5px 8px;border-radius:20px;font-size:12px}.hide{display:none!important}@media(max-width:750px){.side{width:190px}.main{margin-left:190px;width:calc(100% - 190px);padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.tablewrap{overflow:auto}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h2>✦ STUDYFLOW</h2><p class="muted">Student productivity system</p><input id="lu" class="input" placeholder="Username"><input id="lp" class="input" type="password" placeholder="Password"><button class="btn" style="width:100%" onclick="login()">Masuk</button><p id="le" class="muted"></p><hr style="border-color:#29243a"><small class="muted">Register mahasiswa menggunakan kode pendaftaran.</small><input id="rc" class="input" placeholder="Kode pendaftaran"><input id="rn" class="input" placeholder="Nama"><input id="ru" class="input" placeholder="Username baru"><input id="rp" class="input" type="password" placeholder="Password (min. 8)"><button class="btn" style="width:100%" onclick="registerUser()">Daftar</button></div></div>
<div id="app" class="shell hide"><aside class="side"><div class="logo">STUDY<b>FLOW</b><br><small class="muted">STUDENT SYSTEM</small></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div id="sub" class="muted">StudyFlow</div></div><button class="btn" onclick="logout()">Logout</button></div><div id="content"></div></main></div>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('sf_token'),me=null;
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request gagal');return d}
function login(){api('/api/auth/login',{method:'POST',body:{username:$('lu').value,password:$('lp').value}}).then(d=>{token=d.token;localStorage.setItem('sf_token',token);start(d.user)}).catch(e=>$('le').textContent=e.message)}
function registerUser(){api('/api/auth/register',{method:'POST',body:{code:$('rc').value,name:$('rn').value,username:$('ru').value,password:$('rp').value}}).then(()=>alert('Akun berhasil dibuat. Silakan login.')).catch(e=>alert(e.message))}
function start(u){me=u;$('login').classList.add('hide');$('app').classList.remove('hide');buildNav();dashboard()}
function buildNav(){let admin=me.role==='admin';let items=admin?[['dashboard','⌂ Dashboard'],['users','♙ Users'],['access','⌘ Access Control'],['courses','▣ Courses'],['materials','▤ Materials'],['assignments','✓ Assignments'],['ai','✦ AI Management'],['analytics','◈ Analytics'],['security','◆ Security'],['settings','⚙ Settings']]:[['dashboard','⌂ Dashboard'],['courses','▣ Perkuliahan'],['tasks','✓ Tugas'],['schedule','📅 Jadwal'],['planner','🧠 Smart Planner'],['ai','✦ StudyFlow AI'],['timer','⏱ Study Timer'],['stats','◈ Statistik'],['achievement','🏆 Achievement'],['group','👥 Group Project'],['notifications','🔔 Notifikasi'],['profile','♙ Profile'],['settings','⚙ Settings']];$('nav').innerHTML=items.map(x=>`<button onclick="page('${x[0]}',this)">${x[1]}</button>`).join('')}
function page(p,b){document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));b?.classList.add('on');if(p==='dashboard')dashboard();else if(p==='tasks')tasks();else if(p==='courses')courses();else if(p==='users')users();else if(p==='access')access();else generic(p)}
function set(title,html){$('title').textContent=title;$('content').innerHTML=html}
async function dashboard(){document.querySelector('#nav button')?.classList.add('on');if(me.role==='admin'){let s=await api('/api/admin/stats');set('Dashboard',`<div class="cards"><div class="card">Users<div class="num">${s.users}</div></div><div class="card">Tasks<div class="num">${s.tasks}</div></div><div class="card">Courses<div class="num">${s.courses}</div></div><div class="card">Materials<div class="num">${s.materials}</div></div></div><div class="grid"><div class="box"><h3>System Status</h3><div class="row"><span>Database</span><span class="pill">Online</span></div><div class="row"><span>AI Service</span><span class="pill">Ready</span></div></div><div class="box"><h3>Evernight Admin</h3><p class="muted">Control center StudyFlow.</p></div></div>`)}else{let s=await api('/api/dashboard');set('Dashboard',`<div class="cards"><div class="card">Tugas<div class="num">${s.tasks}</div></div><div class="card">Mata Kuliah<div class="num">${s.courses}</div></div><div class="card">Jadwal<div class="num">${s.schedules}</div></div><div class="card">Materi<div class="num">${s.materials}</div></div></div><div class="grid"><div class="box"><h3>Selamat datang, ${me.name} 👋</h3><p class="muted">Kelola tugas, jadwal, materi, dan waktu belajar kamu di satu tempat.</p></div><div class="box"><h3>StudyFlow AI</h3><p class="muted">Tanyakan tugas, jadwal, atau materi kamu.</p></div></div>`)}}
async function tasks(){let a=await api('/api/tasks');set('Tugas',`<div class="box"><h3>Tambah Tugas</h3><input id="tt" class="input" placeholder="Nama tugas"><input id="td" class="input" type="datetime-local"><button class="btn" onclick="addTask()">+ Tambah</button></div><div class="box" style="margin-top:14px"><h3>Daftar Tugas</h3>${a.map(x=>`<div class="row"><span>${x.title}<small class="muted"> ${x.deadline||''}</small></span><span>${x.status}</span></div>`).join('')||'<p class="muted">Belum ada tugas.</p>'}</div>`)}
async function addTask(){await api('/api/tasks',{method:'POST',body:{title:$('tt').value,deadline:$('td').value}});tasks()}
async function courses(){let a=await api('/api/courses');set('Perkuliahan',`<div class="box"><h3>Tambah Mata Kuliah</h3><input id="cn" class="input" placeholder="Nama mata kuliah"><input id="cl" class="input" placeholder="Dosen"><button class="btn" onclick="addCourse()">+ Tambah</button></div><div class="box" style="margin-top:14px">${a.map(x=>`<div class="row"><span>${x.name}</span><span>${x.sks} SKS</span></div>`).join('')||'<p class="muted">Belum ada mata kuliah.</p>'}</div>`)}
async function addCourse(){await api('/api/courses',{method:'POST',body:{name:$('cn').value,lecturer:$('cl').value}});courses()}
async function users(){let a=await api('/api/admin/users');set('Users',`<div class="box"><h3>Users</h3><div class="tablewrap"><table style="width:100%;text-align:left"><tr><th>Nama</th><th>Username</th><th>Role</th></tr>${a.map(x=>`<tr><td>${x.name}</td><td>${x.username}</td><td>${x.role}</td></tr>`).join('')}</table></div></div>`)}
async function access(){let a=await api('/api/admin/access-code');set('Access Control',`<div class="box"><h3>Registration Code</h3><input id="ac" class="input" value="${a.code}"><button class="btn" onclick="saveAccess()">Simpan</button><p class="muted">Status: ${a.active?'Aktif':'Nonaktif'}</p></div>`)}
async function saveAccess(){await api('/api/admin/access-code',{method:'PATCH',body:{code:$('ac').value,active:true}});access()}
function generic(p){const map={schedule:['Jadwal','Atur jadwal kuliah, belajar, ujian, dan deadline.'],planner:['Smart Planner','AI akan membantu menyusun jadwal belajar berdasarkan tugas dan waktu kosong.'],ai:['StudyFlow AI','AI Assistant, AI Material Reader, dan AI Schedule Planner.'],timer:['Study Timer','Pomodoro, stopwatch, custom timer, dan riwayat belajar.'],stats:['Statistik','Progress tugas, jam belajar, target, dan pencapaian.'],achievement:['Achievement','XP, level, streak, dan badge.'],group:['Group Project','Kelola kelompok, anggota, tugas, dan file bersama.'],notifications:['Notifikasi','Deadline, jadwal, pengumuman, dan achievement.'],profile:['Profile','Data akun mahasiswa dan profil.'],materials:['Materials','Kelola materi dan AI Material Reader.'],assignments:['Assignments','Kelola seluruh assignment.'],analytics:['Analytics','Statistik penggunaan sistem.'],security:['Security','Login history, audit log, dan session.'],settings:['Settings','Pengaturan akun dan sistem.']};let x=map[p]||[p,'StudyFlow'];set(x[0],`<div class="box"><h2>${x[0]}</h2><p class="muted">${x[1]}</p></div>`)}
function logout(){localStorage.removeItem('sf_token');location.reload()}
if(token)api('/api/me').then(start).catch(()=>localStorage.removeItem('sf_token'));
</script></body></html>
